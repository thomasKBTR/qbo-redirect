<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Finish connecting QuickBooks</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5b6475;
    --border: #d6dae1; --accent: #2a6ef0; --accent-text: #ffffff;
    --ok: #1c7c46; --err: #b42318;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c; --card: #1e2128; --text: #e8eaf0; --muted: #a0a7b5;
      --border: #343944; --accent: #5b8ff5; --accent-text: #0d1117;
      --ok: #4cc584; --err: #f27a6f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  main {
    width: 100%; max-width: 640px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 28px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  .status { font-weight: 600; margin-bottom: 12px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  textarea {
    width: 100%; height: 120px; resize: none; padding: 12px;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  button {
    margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .hidden { display: none; }
  .copied { margin-left: 10px; color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Finish connecting QuickBooks</h1>
  <div id="status" class="status"></div>
  <p id="instructions"></p>
  <div id="copyBox" class="hidden">
    <textarea id="address" readonly aria-label="Address to paste into Claude"></textarea>
    <button id="copyBtn" type="button">Copy address</button><span id="copied" class="copied hidden">Copied</span>
  </div>
</main>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var status = document.getElementById("status");
    var instructions = document.getElementById("instructions");
    var box = document.getElementById("copyBox");
    var address = document.getElementById("address");

    if (params.get("error")) {
      status.textContent = "QuickBooks didn’t approve the connection.";
      status.className = "status err";
      instructions.textContent = params.get("error") === "access_denied"
        ? "The request was cancelled or denied. Only a company admin can approve it. Go back to Claude and start again."
        : "Intuit returned an error. Go back to Claude and start the connection again.";
    } else if (params.get("code") && params.get("state") && params.get("realmId")) {
      status.textContent = "Approved. One more step.";
      status.className = "status ok";
      instructions.textContent = "Copy this address and paste it into your chat with Claude to finish. It expires in a few minutes.";
      address.value = window.location.href;
      box.classList.remove("hidden");
    } else {
      instructions.textContent = "This page finishes connecting a QuickBooks company to Claude. Start the connection from Claude to use it.";
    }

    document.getElementById("copyBtn").addEventListener("click", function () {
      var done = function () { document.getElementById("copied").classList.remove("hidden"); };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(address.value).then(done, function () { address.select(); document.execCommand("copy"); done(); });
      } else {
        address.select(); document.execCommand("copy"); done();
      }
    });
  })();
</script>
</body>
</html>
